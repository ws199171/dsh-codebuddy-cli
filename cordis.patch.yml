# The dsh-codebuddy-cli bundle: makes the CodeBuddy CLI the route a new Agent
# answers on, so the profile needs no API key and no model picked by hand.
# Installing the package is the whole setup — the rows below are the defaults,
# and a profile's own patch still overrides them by id, last write winning.
#
# The HTTP provider rows stay mounted on purpose, so DeepSeek keeps working and
# stays selectable beside the CLI. Disable them in your own profile patch when
# the CLI should be the only conversation source:
#
#   - id: llm-deepseek
#     disabled: true

- insert:
    # The row id is also the settings namespace: an `llm-cli:` settings section
    # refreshes command/args/models on the very next request, without restarting.
    - id: llm-cli
      name: 'dsh-codebuddy-llm'
      config:
        command: codebuddy
        # `--include-partial-messages` is what makes the answer arrive as it is
        # written; without it a turn with several tool rounds stays silent until
        # the last one ends.
        args:
          - '--print'
          - '--output-format'
          - 'stream-json'
          - '--include-partial-messages'
        # Both transports expose answer text and report CLI-owned thinking
        # and tool activity. `print` starts a child per call;
        # `acp` keeps a child per route and resumes CLI-side sessions.
        transport: print
        # WARNING: this grants the CLI's own tools the desktop process's OS
        # access without asking. Narrow it to `default`/`acceptEdits` when the
        # conversation should not be able to act on its own.
        permissionMode: bypassPermissions

# A new Agent lands on the CLI route, so installing this bundle is the whole
# setup. Without this row the base default (`deepseek-official`) would keep
# answering until someone picked a model by hand, which is the opposite of a
# bundle that exists to need no configuration. `DSH_CLI_MODEL` names an id the
# CLI accepts; unset leaves the CLI's own default selection in charge, which is
# what the CLI's own `--model default` expresses.
- id: agent-default-model
  config:
    provider: codebuddy-cli
    model: !!js process.env.DSH_CLI_MODEL ?? 'default'
